# nginx rule for lightmatter.co/brand — REQUIRED to close the asset-gate bypass.
#
# Production serves this site with nginx (nginx does NOT read .htaccess), so the
# gated brand assets must be blocked from direct HTTP access here. download.php
# reads them from the filesystem via readfile(), so denying the HTTP path does
# not break gated downloads.
#
# Add this INSIDE the existing `server { ... }` block that serves /brand, then
# `nginx -t && systemctl reload nginx`. Adjust the `/brand/` prefix if the
# document-root mapping differs.
#
# This is a server-config change, not a site file — FTP-ing this repo does NOT
# apply it. Someone with shell/root access to the server (or your host's control
# panel, if it exposes nginx config) must add this block and reload nginx.

# Block all direct HTTP access to the gated assets. Only download.php (PHP) may
# read them. `internal` also allows an optional X-Accel-Redirect optimization
# (see note below) while still 404-ing direct requests.
location ^~ /brand/protected/ {
    internal;
    # If you prefer an explicit refusal over a silent 404, use instead:
    #   deny all;
}

# OPTIONAL performance upgrade: have download.php hand large files to nginx via
# X-Accel-Redirect (`header('X-Accel-Redirect: /brand/protected/...')`) instead
# of readfile(). The `internal;` directive above already supports this. If you
# stay with readfile(), no further change is needed.
